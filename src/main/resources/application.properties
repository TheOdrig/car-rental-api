spring.application.name=car-rental-api
server.port=${PORT:8082}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:car_rental}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.schemas=${DB_SCHEMA:car_rental}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.default-produces-media-type=application/json

spring.cache.type=caffeine

logging.level.com.akif=INFO
logging.level.org.springframework.cache=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate.SQL=WARN

jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
jwt.issuer=car-rental-api
jwt.refresh-reuse-grace-seconds=${JWT_REFRESH_REUSE_GRACE_SECONDS:10}

security.rate-limit.enabled=true
security.rate-limit.trusted-proxy-hops=1
security.rate-limit.limits.login.capacity=10
security.rate-limit.limits.login.period-seconds=60
security.rate-limit.limits.register.capacity=5
security.rate-limit.limits.register.period-seconds=600
security.rate-limit.limits.refresh.capacity=30
security.rate-limit.limits.refresh.period-seconds=60
security.rate-limit.limits.password-reset.capacity=5
security.rate-limit.limits.password-reset.period-seconds=900
security.rate-limit.limits.oauth2-callback.capacity=20
security.rate-limit.limits.oauth2-callback.period-seconds=60
security.rate-limit.limits.rental-request.capacity=10
security.rate-limit.limits.rental-request.period-seconds=600

rental.max-rental-days=30
rental.max-lead-days=180
rental.max-open-requests-per-user=3
rental.request-expiry-hours=24
rental.request-expiry-cron=0 */10 * * * *

exchange-rate.api.base-url=https://v6.exchangerate-api.com/v6
exchange-rate.api.connect-timeout=5000
exchange-rate.api.read-timeout=5000

currency.fallback.usd=1
currency.fallback.try=42.49
currency.fallback.eur=0.87
currency.fallback.gbp=0.76
currency.fallback.jpy=156.00
currency.refresh.interval=3600000

oauth2.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
oauth2.google.token-uri=https://oauth2.googleapis.com/token
oauth2.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
oauth2.google.scope=openid email profile

oauth2.github.authorization-uri=https://github.com/login/oauth/authorize
oauth2.github.token-uri=https://github.com/login/oauth/access_token
oauth2.github.user-info-uri=https://api.github.com/user
oauth2.github.user-emails-uri=https://api.github.com/user/emails
oauth2.github.scope=user:email,read:user

oauth2.state.expiration-minutes=10

spring.mail.host=${SENDGRID_HOST:smtp.sendgrid.net}
spring.mail.port=${SENDGRID_PORT:587}
spring.mail.username=${SENDGRID_USERNAME:apikey}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

email.async.core-pool-size=2
email.async.max-pool-size=4
email.async.queue-capacity=500

penalty.grace-period-minutes=60
penalty.hourly-penalty-rate=0.10
penalty.daily-penalty-rate=1.50
penalty.penalty-cap-multiplier=5.0
penalty.severely-late-threshold-hours=24
penalty.hourly-tier-max-hours=6
penalty.single-day-tier-max-hours=24

damage.minor-threshold=500
damage.moderate-threshold=2000
damage.major-threshold=10000
damage.default-insurance-deductible=1000.00
damage.max-photos-per-report=10
damage.max-photo-size-bytes=10485760
damage.allowed-photo-types=image/jpeg,image/png,image/heic
damage.photo-storage-directory=damage-photos
damage.photo-url-expiration-minutes=60
damage.report-window-days-after-return=7

spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20
request.max-json-body-bytes=1048576
spring.servlet.multipart.max-file-size=${damage.max-photo-size-bytes}B
spring.servlet.multipart.max-request-size=100MB

pricing.min-daily-price=10
pricing.max-daily-price=10000
pricing.daily-limits.jpy.min=1000
pricing.daily-limits.jpy.max=1500000

stripe.webhook.tolerance-seconds=300
stripe.api.base-url=https://api.stripe.com
stripe.api.max-network-retries=1
stripe.api.connect-timeout-ms=3000
stripe.api.read-timeout-ms=10000
payment.refund.lock-timeout-ms=5000
payment.refund.statement-timeout-ms=30000

spring.modulith.events.republish-outstanding-events-on-restart=true
spring.modulith.events.completion-mode=delete
spring.modulith.events.registry-trigger-annotation=org.springframework.modulith.events.ApplicationModuleListener

spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'; SET statement_timeout = '${DB_STATEMENT_TIMEOUT:30s}'; SET lock_timeout = '${DB_LOCK_TIMEOUT:5s}'; SET idle_in_transaction_session_timeout = '${DB_IDLE_IN_TRANSACTION_TIMEOUT:60s}'
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

security.rate-limit.limits.payment-intent.capacity=10
security.rate-limit.limits.payment-intent.period-seconds=60
security.rate-limit.limits.availability-search.capacity=60
security.rate-limit.limits.availability-search.period-seconds=60

rental.payment-window-days=5
rental.payment-grace-hours=12
rental.payment-expiry-cron=0 */10 * * * *
rental.no-show-days=1
rental.no-show-cron=0 */30 * * * *

stripe.metadata.environment=dev
stripe.webhook.max-body-bytes=262144
payment.sync-min-interval-seconds=10
payment.repair.enabled=true
payment.repair.min-age-minutes=30
payment.repair.interval-ms=1800000
payment.reconciliation.max-individual-lookups=200
spring.datasource.hikari.maximum-pool-size=10

management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.prometheus.access=read-only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram[http.server.requests]=true
management.health.mail.enabled=false

car.similar.price-band=0.20
car.similar.candidate-multiplier=3
car.similar.body-type-weight=50
car.similar.brand-weight=30
car.similar.price-weight=20
car.availability.max-search-days=${rental.max-rental-days}

rental.reminder.batch-size=50
rental.reminder.max-batches=200
rental.reminder.pickup-cron=0 0 8 * * *
rental.reminder.return-cron=0 0 9 * * *

pricing.season.peak.start=--06-01
pricing.season.peak.end=--08-31
pricing.season.peak.multiplier=1.25
pricing.season.offpeak.start=--11-01
pricing.season.offpeak.end=--02-28
pricing.season.offpeak.multiplier=0.90
pricing.early-booking.tier1.days=30
pricing.early-booking.tier1.multiplier=0.85
pricing.early-booking.tier2.days=14
pricing.early-booking.tier2.multiplier=0.90
pricing.early-booking.tier3.days=7
pricing.early-booking.tier3.multiplier=0.95
pricing.duration.tier1.days=7
pricing.duration.tier1.multiplier=0.90
pricing.duration.tier2.days=14
pricing.duration.tier2.multiplier=0.85
pricing.duration.tier3.days=30
pricing.duration.tier3.multiplier=0.80
pricing.weekend.multiplier=1.15
pricing.weekend.days=FRIDAY,SATURDAY,SUNDAY
pricing.demand.high.threshold=80
pricing.demand.high.multiplier=1.20
pricing.demand.moderate.threshold=50
pricing.demand.moderate.multiplier=1.10

damage.currency-limits.jpy.minor-threshold=2000
damage.currency-limits.jpy.moderate-threshold=8000
damage.currency-limits.jpy.major-threshold=40000
damage.currency-limits.jpy.insurance-deductible=4000

dashboard.alerts.low-availability-percent=20.00
dashboard.alerts.dispute-days-threshold=7
dashboard.alerts.overdue-page-size=100
dashboard.alerts.interval-ms=300000
rental.late-return.detection-interval-ms=900000
payment.reconciliation.cron=0 0 2 * * *
auth.refresh-token.cleanup-cron=0 30 3 * * *
auth.refresh-token.retention-days=7
app.password-reset.token-expiry-hours=1
auth.avatar.max-file-size-bytes=5242880
auth.avatar.allowed-types=image/jpeg,image/png,image/gif,image/webp
auth.avatar.default-url-expiration-minutes=60
