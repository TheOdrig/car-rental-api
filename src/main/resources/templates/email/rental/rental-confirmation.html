<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>Rental Confirmation - CarRental</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        table {
            border-collapse: collapse;
            border-spacing: 0;
        }

        @media (prefers-color-scheme: dark) {
            .email-container {
                background-color: #1f2937 !important;
            }

            .email-body {
                background-color: #111827 !important;
                color: #f3f4f6 !important;
            }

            .detail-box {
                background-color: #1f2937 !important;
                border-color: #374151 !important;
            }

            .text-label {
                color: #d1d5db !important;
            }

            .text-value {
                color: #f9fafb !important;
            }

            .text-muted {
                color: #9ca3af !important;
            }
        }
    </style>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f4f5;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
        style="background-color: #f4f4f5;">
        <tr>
            <td align="center" style="padding: 40px 20px;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
                    style="max-width: 600px; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);"
                    class="email-container">

                    <tr>
                        <td style="padding: 0;">
                            <div th:replace="~{email/shared/header :: header('Booking Confirmed')}"></div>
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding: 40px 30px 20px 30px;">
                            <svg width="64" height="64" viewBox="0 0 64 64" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <circle cx="32" cy="32" r="30" fill="#d1fae5" stroke="#10b981" stroke-width="2" />
                                <path d="M20 32L28 40L44 24" stroke="#10b981" stroke-width="3" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </td>
                    </tr>

                    <tr>
                        <td class="email-body"
                            style="padding: 0 40px 40px 40px; color: #111827; font-size: 16px; line-height: 1.6;">

                            <p style="margin: 0 0 20px 0; font-size: 16px;">Great news!</p>

                            <p style="margin: 0 0 24px 0; font-size: 16px;">
                                Your rental has been confirmed. Here are your booking details:
                            </p>

                            <div style="background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin: 24px 0;"
                                class="detail-box">
                                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                                    <tr>
                                        <td style="padding: 8px 0; font-size: 14px; color: #4b5563;" class="text-label">
                                            Rental ID:</td>
                                        <td align="right"
                                            style="padding: 8px 0; font-size: 14px; font-weight: 600; color: #111827;"
                                            class="text-value">
                                            <span th:text="${rentalId}">12345</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 8px 0; font-size: 14px; color: #4b5563;" class="text-label">
                                            Vehicle:</td>
                                        <td align="right"
                                            style="padding: 8px 0; font-size: 14px; font-weight: 600; color: #111827;"
                                            class="text-value">
                                            <span th:text="${carBrand} + ' ' + ${carModel}">Toyota Camry</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 8px 0; font-size: 14px; color: #4b5563;" class="text-label">
                                            Pickup:</td>
                                        <td align="right"
                                            style="padding: 8px 0; font-size: 14px; font-weight: 600; color: #111827;"
                                            class="text-value">
                                            <span th:text="${pickupDate}">January 25, 2026</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 8px 0; font-size: 14px; color: #4b5563;" class="text-label">
                                            Return:</td>
                                        <td align="right"
                                            style="padding: 8px 0; font-size: 14px; font-weight: 600; color: #111827;"
                                            class="text-value">
                                            <span th:text="${returnDate}">January 30, 2026</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 8px 0; font-size: 14px; color: #4b5563;" class="text-label">
                                            Location:</td>
                                        <td align="right"
                                            style="padding: 8px 0; font-size: 14px; font-weight: 600; color: #111827;"
                                            class="text-value">
                                            <span th:text="${pickupLocation}">Airport Terminal</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td colspan="2" style="padding: 16px 0 8px 0; border-top: 1px solid #e5e7eb;">
                                            <table role="presentation" border="0" cellpadding="0" cellspacing="0"
                                                width="100%">
                                                <tr>
                                                    <td style="font-size: 16px; font-weight: 700; color: #111827;"
                                                        class="text-value">
                                                        Total:</td>
                                                    <td align="right"
                                                        style="font-size: 18px; font-weight: 700; color: #4356d9;">
                                                        <span th:text="${currency} + ' ' + ${totalPrice}">$250.00</span>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>
                                </table>
                            </div>

                            <div
                                th:replace="~{email/shared/info-box :: infoBox('Please bring a valid driver\'s license and credit card at pickup. Arrive 15 minutes early to complete the paperwork.')}">
                            </div>

                            <p style="margin: 24px 0 0 0; font-size: 14px; color: #6b7280;" class="text-muted">
                                We'll send you a reminder 24 hours before your pickup time.
                            </p>

                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 0;">
                            <div th:replace="~{email/shared/footer :: footer}"></div>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>
