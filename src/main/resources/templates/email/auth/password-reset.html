<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>Password Reset Request - CarRental</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        table {
            border-collapse: collapse;
            border-spacing: 0;
        }

        @media (prefers-color-scheme: dark) {
            .email-container {
                background-color: #1f2937 !important;
            }

            .email-body {
                background-color: #111827 !important;
                color: #f3f4f6 !important;
            }

            .text-label {
                color: #d1d5db !important;
            }

            .text-value {
                color: #f9fafb !important;
            }

            .text-muted {
                color: #9ca3af !important;
            }
        }
    </style>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f4f5;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
        style="background-color: #f4f4f5;">
        <tr>
            <td align="center" style="padding: 40px 20px;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
                    style="max-width: 600px; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);"
                    class="email-container">
                    <tr>
                        <td style="padding: 0;">
                            <div th:replace="~{email/shared/header :: header('Password Reset Request')}"></div>
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding: 40px 30px 20px 30px;">
                            <svg width="64" height="64" viewBox="0 0 64 64" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <circle cx="32" cy="32" r="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
                                <path
                                    d="M32 20C28.6863 20 26 22.6863 26 26V30H20C18.8954 30 18 30.8954 18 32V44C18 45.1046 18.8954 46 20 46H44C45.1046 46 46 45.1046 46 44V32C46 30.8954 45.1046 30 44 30H38V26C38 22.6863 35.3137 20 32 20ZM30 26C30 24.8954 30.8954 24 32 24C33.1046 24 34 24.8954 34 26V30H30V26Z"
                                    fill="#4356d9" />
                                <circle cx="32" cy="37" r="2" fill="#ffffff" />
                                <rect x="31" y="37" width="2" height="4" fill="#ffffff" />
                            </svg>
                        </td>
                    </tr>

                    <tr>
                        <td class="email-body"
                            style="padding: 0 40px 40px 40px; color: #111827; font-size: 16px; line-height: 1.6;">
                            <p style="margin: 0 0 20px 0; font-size: 16px;">Hello,</p>
                            <p style="margin: 0 0 24px 0; font-size: 16px;">
                                We received a request to reset the password for your CarRental account associated with
                                <strong th:text="${email}" style="color: #4356d9;"
                                    class="text-value">user@example.com</strong>.
                            </p>

                            <p style="margin: 0 0 32px 0; font-size: 16px;">
                                Click the button below to reset your password:
                            </p>
                            <div th:replace="~{email/shared/button :: primaryButton('Reset Password', ${resetLink})}">
                            </div>
                            <div
                                th:replace="~{email/shared/warning-box :: warningBox('This link will expire in ' + ${expirationHours} + ' hour(s). Please reset your password promptly.')}">
                            </div>
                            <div
                                th:replace="~{email/shared/info-box :: infoBox('If you did not request a password reset, you can safely ignore this email. Your password will remain unchanged.')}">
                            </div>
                            <p style="margin: 24px 0 0 0; font-size: 14px; color: #6b7280; line-height: 1.6;"
                                class="text-muted">
                                If the button above doesn't work, copy and paste this link into your browser:
                            </p>
                            <p
                                style="margin: 8px 0 0 0; font-size: 12px; color: #4356d9; word-break: break-all; line-height: 1.4;">
                                <a th:href="${resetLink}" href="#" style="color: #4356d9; text-decoration: underline;"
                                    th:text="${resetLink}">
                                    https://example.com/reset-password?token=xxx
                                </a>
                            </p>

                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 0;">
                            <div th:replace="~{email/shared/footer :: footer}"></div>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>
