<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="header(title)" style="margin: 0; padding: 0;">
        <div style="background-color: #4356d9; padding: 40px 30px; text-align: center; border-radius: 0;">
            <h1
                style="color: #ffffff; font-size: 28px; font-weight: 700; margin: 0 0 8px 0; letter-spacing: -0.5px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
                CarRental
            </h1>

            <h2 th:text="${title}"
                style="color: #ffffff; font-size: 20px; font-weight: 400; margin: 0; opacity: 0.95; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
                Email Title
            </h2>
        </div>
    </div>
</body>

</html>
