<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="primaryButton(text, url)" style="margin: 0; padding: 0;">
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="margin: 32px auto; width: 100%;">
            <tr>
                <td align="center">
                    <a th:href="${url}" href="#" style="display: inline-block; 
                          background-color: #4356d9; 
                          color: #ffffff !important; 
                          text-decoration: none; 
                          padding: 16px 48px; 
                          border-radius: 8px; 
                          font-weight: 600;
                          font-size: 16px;
                          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                          line-height: 1.5;
                          transition: background-color 0.2s;">
                        <span th:text="${text}" style="color: #ffffff;">Button Text</span>
                    </a>
                </td>
            </tr>
        </table>
    </div>
</body>

</html>
