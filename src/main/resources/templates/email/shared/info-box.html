<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="infoBox(message)" style="margin: 0; padding: 0;">
        <div style="background-color: #eff6ff; 
                border-left: 4px solid #3b82f6; 
                padding: 16px 20px; 
                margin: 20px 0; 
                border-radius: 4px;">
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="width: 100%;">
                <tr>
                    <td style="vertical-align: middle; width: 24px; padding-right: 12px;">

                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="10" cy="10" r="9" stroke="#3b82f6" stroke-width="2" fill="none" />
                            <path d="M10 6V10M10 14H10.01" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </td>
                    <td style="vertical-align: middle;">
                        <p th:text="${message}"
                            style="color: #1e40af; 
                              margin: 0; 
                              font-size: 14px; 
                              line-height: 1.6;
                              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
                            Info message
                        </p>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</body>

</html>
