<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="warningBox(message)" style="margin: 0; padding: 0;">
        <div style="background-color: #fffbeb; 
                border-left: 4px solid #f59e0b; 
                padding: 16px 20px; 
                margin: 20px 0; 
                border-radius: 4px;">
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="width: 100%;">
                <tr>
                    <td style="vertical-align: middle; width: 24px; padding-right: 12px;">

                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M10 1L1 17H19L10 1Z" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" fill="none" />
                            <path d="M10 7V11M10 15H10.01" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </td>
                    <td style="vertical-align: middle;">
                        <p th:text="${message}"
                            style="color: #92400e; 
                              margin: 0; 
                              font-size: 14px; 
                              line-height: 1.6;
                              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
                            Warning message
                        </p>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</body>

</html>
