<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>Damage Assessment Resolved - CarRental</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        table {
            border-collapse: collapse;
            border-spacing: 0;
        }

        @media (prefers-color-scheme: dark) {
            .email-container {
                background-color: #1f2937 !important;
            }

            .email-body {
                background-color: #111827 !important;
                color: #f3f4f6 !important;
            }

            .detail-box {
                background-color: #1f2937 !important;
                border-color: #374151 !important;
            }

            .text-label {
                color: #d1d5db !important;
            }

            .text-value {
                color: #f9fafb !important;
            }

            .text-muted {
                color: #9ca3af !important;
            }
        }
    </style>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f4f5;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
        style="background-color: #f4f4f5;">
        <tr>
            <td align="center" style="padding: 40px 20px;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
                    style="max-width: 600px; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);"
                    class="email-container">

                    <tr>
                        <td style="padding: 0;">
                            <div th:replace="~{email/shared/header :: header('Dispute Resolved')}"></div>
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding: 40px 30px 20px 30px;">
                            <svg width="64" height="64" viewBox="0 0 64 64" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <circle cx="32" cy="32" r="30" fill="#d1fae5" stroke="#10b981" stroke-width="2" />
                                <path d="M22 32L28 38L42 24" stroke="#10b981" stroke-width="3" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </td>
                    </tr>

                    <tr>
                        <td class="email-body"
                            style="padding: 0 40px 40px 40px; color: #111827; font-size: 16px; line-height: 1.6;">

                            <p style="margin: 0 0 20px 0; font-size: 16px;">Hello,</p>

                            <p style="margin: 0 0 24px 0; font-size: 16px;">
                                Your dispute regarding the damage assessment for rental
                                <strong th:text="${rentalId}">12345</strong> has been resolved.
                            </p>

                            <div style="background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin: 24px 0;"
                                class="detail-box">
                                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                                    <tr>
                                        <td style="padding: 8px 0; font-size: 14px; color: #4b5563;" class="text-label">
                                            Adjusted Liability:</td>
                                        <td align="right"
                                            style="padding: 8px 0; font-size: 14px; font-weight: 600; color: #111827;"
                                            class="text-value">
                                            <span th:text="|${adjustedCharge} ${currency}|">150.00 TRY</span>
                                        </td>
                                    </tr>
                                    <tr th:if="${refundAmount > 0}">
                                        <td style="padding: 8px 0; font-size: 14px; color: #4b5563;" class="text-label">
                                            Refund Amount:</td>
                                        <td align="right"
                                            style="padding: 8px 0; font-size: 14px; font-weight: 600; color: #10b981;"
                                            class="text-value">
                                            <span th:text="|${refundAmount} ${currency}|">100.00 TRY</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 8px 0; font-size: 14px; color: #4b5563;" class="text-label">
                                            Resolution Notes:</td>
                                        <td align="right"
                                            style="padding: 8px 0; font-size: 14px; font-weight: 600; color: #111827;"
                                            class="text-value">
                                            <span th:text="${resolutionNotes}">Assessment adjusted based on
                                                evidence</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 8px 0; font-size: 14px; color: #4b5563;" class="text-label">
                                            Resolved At:</td>
                                        <td align="right"
                                            style="padding: 8px 0; font-size: 14px; font-weight: 600; color: #111827;"
                                            class="text-value">
                                            <span th:text="${resolvedAt}">January 24, 2026 at 14:30</span>
                                        </td>
                                    </tr>
                                </table>
                            </div>

                            <div
                                th:replace="~{email/shared/info-box :: infoBox('Please check your account for full details of the resolution and any adjustments to charges.')}">
                            </div>

                            <p style="margin: 24px 0 0 0; font-size: 14px; color: #111827;" class="text-value">
                                Thank you for your cooperation.
                            </p>

                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 0;">
                            <div th:replace="~{email/shared/footer :: footer}"></div>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>
