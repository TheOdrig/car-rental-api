spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

cors.allowed-origins=${CORS_ORIGINS}
security.rate-limit.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS}
security.rate-limit.trusted-proxy-hops=${TRUSTED_PROXY_HOPS}
security.rate-limit.trusted-client-ip-header=${TRUSTED_CLIENT_IP_HEADER:}
security.rate-limit.trusted-proxy-cidrs=${TRUSTED_PROXY_CIDRS:}

r2.endpoint=${R2_ENDPOINT}
r2.bucket-name=${R2_BUCKET_NAME}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}

exchange-rate.api.key=${EXCHANGE_RATE_API_KEY}

oauth2.google.client-id=${GOOGLE_CLIENT_ID}
oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET}
oauth2.google.redirect-uri=${APP_BASE_URL}/api/auth/callback/google
oauth2.github.client-id=${GITHUB_CLIENT_ID}
oauth2.github.client-secret=${GITHUB_CLIENT_SECRET}
oauth2.github.redirect-uri=${APP_BASE_URL}/api/auth/callback/github
oauth2.state.secret=${OAUTH2_STATE_SECRET}

stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.metadata.environment=${STRIPE_METADATA_ENVIRONMENT}

email.from=${EMAIL_FROM}
email.enabled=true
spring.mail.password=${SENDGRID_API_KEY}

app.password-reset.base-url=${APP_BASE_URL}
