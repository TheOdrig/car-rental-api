spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.flyway.clean-disabled=false
spring.flyway.validate-on-migrate=false

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/car_rental}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

logging.level.com.akif=DEBUG
logging.level.org.springframework.cache=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

jwt.secret=${JWT_SECRET:dev-only-jwt-secret-do-not-use-outside-local-development-0123456789}

cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}
security.rate-limit.trust-forwarded-headers=false

exchange-rate.api.key=${EXCHANGE_RATE_API_KEY:}

oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth2.google.redirect-uri=${APP_BASE_URL:http://localhost:3000}/api/auth/callback/google
oauth2.github.client-id=${GITHUB_CLIENT_ID:}
oauth2.github.client-secret=${GITHUB_CLIENT_SECRET:}
oauth2.github.redirect-uri=${APP_BASE_URL:http://localhost:3000}/api/auth/callback/github
oauth2.state.secret=${OAUTH2_STATE_SECRET:dev-only-oauth2-state-secret-0123456789abcdef}

stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}

email.from=${EMAIL_FROM:noreply@car-rental.local}
email.enabled=${EMAIL_ENABLED:false}
spring.mail.password=${SENDGRID_API_KEY:}
email.async.core-pool-size=2
email.async.max-pool-size=4
email.async.queue-capacity=100

app.password-reset.base-url=${APP_BASE_URL:http://localhost:3000}
